<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200 px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-gray-100">

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Welcome Back</h1>
            <p class="text-gray-500 text-sm mt-2">Please login to your account</p>
        </div>

        <!-- Username -->
        <div class="mb-4">
            <label class="text-sm text-gray-600 mb-1 block">Username</label>
            <input
                [(ngModel)]="username"
                placeholder="Enter your username"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
            />
        </div>

        <!-- Password -->
        <div class="mb-6">
            <label class="text-sm text-gray-600 mb-1 block">Password</label>
            <input
                [(ngModel)]="password"
                type="password"
                placeholder="Enter your password"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
            />
        </div>

        <!-- Button -->
        <button
            (click)="login()"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md hover:shadow-lg"
        >
            Login
        </button>

    </div>

</div>
